<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JON_AI_CTRL — Alerts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../src/css/tokens.css">
<link rel="stylesheet" href="../src/css/base.css">
<link rel="stylesheet" href="../src/css/components.css">
<link rel="stylesheet" href="../src/css/effects.css">
<script src="../boot-check.js"></script>
</head>
<body>
<script type="module">
/* Alerts — 720 x 132, centre-top, 5 s life (§07).
   Browser source: 720 x 132, or full 1920 x 1080 if you would rather let
   the overlay centre them for you. Alerts fired from the control page
   appear here and on any scene with alerts enabled. */
import config from '../config.js';
import { startModule } from '../src/js/scene.js';

startModule(config, {
  width: 720,
  height: 132,
  alerts: true,
  render() {
    /* The alert layer mounts itself; nothing renders until one fires. */
    return '';
  },
});
</script>
</body>
</html>
