<script type="module">
/* Goal rail — 1856 wide including its label row. Browser source: 1856 x 30. */
import config from '../config.js';
import { startModule } from '../src/js/scene.js';
import { goalRail } from '../src/js/components.js';

startModule(config, {
  width: 1856,
  height: 30,
  render(state) {
    return state.widgets.goalRail.enabled ? goalRail(state) : '';
  },
});
</script>
