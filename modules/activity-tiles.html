<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JON_AI_CTRL — Activity tiles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../src/css/tokens.css">
<link rel="stylesheet" href="../src/css/base.css">
<link rel="stylesheet" href="../src/css/components.css">
<link rel="stylesheet" href="../src/css/effects.css">
<script src="../boot-check.js"></script>
</head>
<body>
<script type="module">
/* Activity — 3 x 250 x 70, gap 16 = 798 x 70. Browser source: 798 x 70.
   Switching Activity to "Recent events" in the dashboard makes this page
   draw the list instead, which is taller: give the source 798 x 480 if you
   intend to use list mode standalone. */
import config from '../config.js';
import { startModule } from '../src/js/scene.js';
import { activityPanel } from '../src/js/components.js';

startModule(config, {
  width: 798,
  height: 480,
  render(state) {
    return state.widgets.activity.enabled ? activityPanel(state) : '';
  },
});
</script>
</body>
</html>
