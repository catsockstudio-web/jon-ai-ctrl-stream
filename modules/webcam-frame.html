<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nightwire — WebcamFrame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../src/css/tokens.css">
<link rel="stylesheet" href="../src/css/base.css">
<link rel="stylesheet" href="../src/css/components.css">
<link rel="stylesheet" href="../src/css/effects.css">
<script src="../boot-check.js"></script>
</head>
<body>
<script type="module">
/* WebcamFrame — 400 x 225. Browser source: 400 x 253 (the nameplate hangs
   14px below the frame, so give the source a little headroom).
   Place your camera source *behind* this one in OBS. */
import config from '../config.js';
import { startModule } from '../src/js/scene.js';
import { webcamFrame } from '../src/js/components.js';

startModule(config, {
  width: 400,
  height: 253,
  render(state) {
    return state.widgets.webcam.enabled ? webcamFrame(state) : '';
  },
});
</script>
</body>
</html>
