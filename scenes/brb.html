<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JON_AI_CTRL — 04 BRB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../src/css/tokens.css">
<link rel="stylesheet" href="../src/css/base.css">
<link rel="stylesheet" href="../src/css/components.css">
<script src="../boot-check.js"></script>
</head>
<body>
<script type="module">
/* 04 / BRB — full 1920 x 1080.
   The sheet draws this at 944 x 531 and labels it "full 1920 x 1080, scaled
   to fit"; every value below is the sheet's value x (1920/944), so the
   proportions match the design exactly at full resolution. */
import config from '../config.js';
import { startScene } from '../src/js/scene.js';
import { terminalLine, stinger, sceneGround} from '../src/js/components.js';
import { typeOn, fitToHeight } from '../src/js/widgets.js';
import { goalPercent } from '../src/js/format.js';

const BOOT_LINE = '> grinder: running · stream: held';

startScene(config, {
  render(state) {
    const brew = Math.round(goalPercent(state.goals.coffee));
    return `
      ${sceneGround(`
  <div class="ja-scene__bg" data-asset="brbBackground"></div>
        <div class="ja-scene__glow" style="inset:-6%;background:radial-gradient(60% 60% at 30% 70%,rgba(240,168,85,.2),transparent 60%),radial-gradient(60% 60% at 75% 25%,rgba(139,77,255,.3),transparent 60%);animation-duration:calc(24s * var(--motion))"></div>
        <div class="ja-scene__grid"></div>
        <div style="position:absolute;left:114px;top:114px;right:114px;bottom:114px;border:var(--hairline-w) solid rgba(139,77,255,.2);border-radius:3px 20px 3px 20px"></div>
      `)}

      <div data-fit-col style="position:absolute;left:195px;top:325px;width:875px;display:flex;flex-direction:column;gap:37px">
        <div style="font-family:var(--font-mono);font-size:31px;letter-spacing:.32em;color:var(--amber)">STATUS // REFILLING</div>
        <div class="ja-scene__headline" style="font-size:159px">BE RIGHT<br><span style="background:linear-gradient(96deg,var(--amber),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent">BACK</span></div>
        ${terminalLine(BOOT_LINE, { size: 35 })}
        <div style="display:flex;align-items:center;gap:28px;margin-top:20px">
          <div style="flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden">
            <div style="width:${brew}%;height:100%;background:linear-gradient(90deg,var(--amber),var(--cyan));animation:ja-fill calc(3.5s * var(--motion)) ease-in-out infinite;transition:width 600ms var(--ease)"></div>
          </div>
          <div style="font-family:var(--font-mono);font-size:31px;color:var(--amber)">BREW ${brew}%</div>
        </div>
      </div>

      <div class="ja-mascot" data-asset="brbArt" style="position:absolute;right:224px;top:244px;width:569px;height:610px;border-color:rgba(240,168,85,.4);border-radius:6px 26px 6px 26px;background:repeating-linear-gradient(135deg,rgba(240,168,85,.08) 0 10px,rgba(10,10,15,.35) 10px 20px)">
        <div class="ja-steam" style="position:absolute;left:50%;top:106px;transform:translateX(-50%);gap:20px;height:89px">
          <span class="ja-steam__bar" style="width:10px;height:53px"></span>
          <span class="ja-steam__bar" style="width:10px;height:69px"></span>
          <span class="ja-steam__bar" style="width:10px;height:45px"></span>
        </div>
        <div class="ja-mascot__caption" style="bottom:53px;font-size:31px">brb-art.png<span style="font-size:26px">mug / mascot · optional</span></div>
      </div>

      <div data-footer style="position:absolute;left:195px;bottom:163px;font-family:var(--font-mono);font-size:28px;letter-spacing:.24em;color:var(--text-2)">${state.channel.wordmark} · CHAT AMONGST YOURSELVES</div>
      ${stinger()}
    `;
  },
  onRender(state, stage) {
    typeOn(stage.querySelector('[data-bind="terminal-text"]'), BOOT_LINE, { motion: state.display.motion });
    /* The column has to clear the footer. Its natural height depends on the
       loaded fonts — with fallback faces the label, terminal and progress rows
       all run taller than the sheet's metrics and the column grows into the
       footer. Measure the real gap rather than hardcoding one, and let the
       headline give until the whole column fits. */
    const column = stage.querySelector('[data-fit-col]');
    const footer = stage.querySelector('[data-footer]');
    if (column && footer) {
      const budget = footer.getBoundingClientRect().top - column.getBoundingClientRect().top - 24;
      fitToHeight(stage.querySelector('.ja-scene__headline'), budget, { minSize: 90, measure: column });
    }
  },
});
</script>
</body>
</html>
