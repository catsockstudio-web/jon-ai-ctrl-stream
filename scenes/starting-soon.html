<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JON_AI_CTRL — 02 Starting Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../src/css/tokens.css">
<link rel="stylesheet" href="../src/css/base.css">
<link rel="stylesheet" href="../src/css/components.css">
<link rel="stylesheet" href="../src/css/effects.css">
<script src="../boot-check.js"></script>
</head>
<body>
<script type="module">
/* 02 / STARTING SOON — full 1920 x 1080 scene.
   starting-background.jpg drops in behind the CSS glow field if present. */
import config from '../config.js';
import { startScene } from '../src/js/scene.js';
import { motionEnabled } from '../src/js/theme.js';
import { mascotSlot, terminalLine, countdown, stinger, sceneGround} from '../src/js/components.js';
import { caffeinePercent } from '../src/js/format.js';
import { typeOn, fitToHeight } from '../src/js/widgets.js';

const BOOT_LINE = '> brewing_sequence: initializing';

startScene(config, {
  render(state) {
    const caffeine = caffeinePercent(state.caffeine, state.stream);
    const showCountdown = Number.isFinite(state.stream.countdownSeconds);
    return `
      ${sceneGround(`
  <div class="ja-scene__bg" data-asset="startingBackground"></div>
        <div class="ja-scene__glow" style="background:radial-gradient(70% 60% at 22% 30%,rgba(139,77,255,.34),transparent 62%),radial-gradient(65% 60% at 82% 72%,rgba(34,230,224,.22),transparent 60%)"></div>
        <div class="ja-scene__grid"></div>
        <div class="ja-scene__vignette"></div>
        <div class="ja-scene__border"></div>
      `)}

      <div style="position:absolute;left:180px;top:300px;width:940px;display:flex;flex-direction:column;gap:28px">
        <div style="display:flex;align-items:center;gap:14px;font-family:var(--font-mono);font-size:20px;letter-spacing:.32em;color:var(--cyan)">
          <span class="ja-dot ja-dot--lg"></span>SYSTEM // PRE-FLIGHT
        </div>
        <div class="ja-scene__headline">THE MORNING<br><span class="ja-gradient-text">GRIND</span> IS STARTING SOON</div>
        ${terminalLine(BOOT_LINE)}
        <div style="display:flex;align-items:center;gap:28px;margin-top:8px">
          ${showCountdown ? `
            <div style="display:flex;flex-direction:column;gap:10px">
              <div class="ja-label ja-label--lg">COUNTDOWN</div>
              ${countdown(state.stream.countdownSeconds)}
            </div>
            <div style="width:1px;height:96px;background:rgba(255,255,255,.12)"></div>` : ''}
          <div style="display:flex;flex-direction:column;gap:10px">
            <div class="ja-label ja-label--lg">CAFFEINE LEVEL</div>
            <div style="width:320px;height:10px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden">
              <div style="width:${caffeine}%;height:100%;background:linear-gradient(90deg,var(--amber),var(--purple));box-shadow:0 0 16px rgba(240,168,85,.5);transition:width 600ms var(--ease)"></div>
            </div>
            <div style="font-family:var(--font-mono);font-size:18px;color:var(--amber)">${caffeine}% · CUP ${state.caffeine.cup} OF ${state.caffeine.cups}</div>
          </div>
        </div>
      </div>

      <div style="position:absolute;right:180px;top:230px">${mascotSlot({ width: 520, height: 620 })}</div>

      <div style="position:absolute;left:180px;bottom:150px;display:flex;align-items:center;gap:22px;font-family:var(--font-mono);font-size:18px;letter-spacing:.24em;color:var(--text-2)">
        <span>${state.channel.twitch}</span><span style="color:rgba(255,255,255,.2)">·</span>
        <span>${state.channel.location}</span><span style="color:rgba(255,255,255,.2)">·</span>
        <span style="color:var(--cyan)">CHAT IS OPEN</span>
      </div>
      ${stinger()}
    `;
  },
  onRender(state, stage) {
    /* TERMINAL TYPE — full-screen scenes only, never over gameplay. */
    typeOn(stage.querySelector('[data-bind="terminal-text"]'), BOOT_LINE, { motion: motionEnabled(state) });
    /* Headline must clear the terminal line, the caffeine block and the
       footer at bottom:150. 300 -> 630 is the space §02 gives it. */
    fitToHeight(stage.querySelector('.ja-scene__headline'), 330);
  },
});
</script>
</body>
</html>
