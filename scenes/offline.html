<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nightwire — 06 Offline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../src/css/tokens.css">
<link rel="stylesheet" href="../src/css/base.css">
<link rel="stylesheet" href="../src/css/components.css">
<link rel="stylesheet" href="../src/css/effects.css">
<script src="../boot-check.js"></script>
</head>
<body>
<script type="module">
/* 06 / OFFLINE PANEL — 1920 x 1080 export for the Twitch offline slot.
   Same system, no live modules. */
import config from '../config.js';
import { startScene } from '../src/js/scene.js';
import { mascotSlot, sceneGround } from '../src/js/components.js';
import { escapeHtml } from '../src/js/format.js';

startScene(config, {
  render(state) {
    const { channel } = state;
    return `
      ${/* The other three full-screen cards (Starting Soon, BRB, Ending) all take
            an optional full-bleed background; Offline was the one left without a
            slot for it, despite being the card shown the longest of any of them. */''}
      ${sceneGround(`
  <div class="ja-scene__bg" data-asset="offlineBackground"></div>
        <div class="ja-scene__glow" style="background:radial-gradient(65% 65% at 18% 28%,rgba(185,92,240,.3),transparent 60%),radial-gradient(60% 60% at 88% 78%,rgba(34,230,224,.2),transparent 58%);animation-duration:calc(32s * var(--motion))"></div>
        <div class="ja-scene__grid" style="background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 5px)"></div>
        <div class="ja-scene__vignette" style="background:linear-gradient(180deg,rgba(10,10,15,.3),rgba(10,10,15,.72))"></div>
      `)}

      <div style="position:absolute;left:140px;top:340px;width:1000px;display:flex;flex-direction:column;gap:26px">
        <div style="font-family:var(--font-mono);font-size:20px;letter-spacing:.34em;color:var(--text-2)">STATUS // OFFLINE</div>
        <div class="ja-gradient-text" data-fit-width data-fit-min="70" style="font-family:var(--font-display);font-weight:700;font-size:150px;line-height:.9;letter-spacing:-.015em">${escapeHtml(channel.wordmark)}</div>
        <div style="font-family:var(--font-display);font-weight:600;font-size:46px;letter-spacing:.06em;color:var(--text-1)">${channel.tagline.toUpperCase()}</div>
        <div style="font-size:28px;color:var(--text-2);max-width:760px;text-wrap:pretty">${channel.blurb}</div>
        <div style="display:flex;gap:16px;margin-top:12px">
          <div style="padding:14px 24px;background:rgba(14,14,20,.8);border:var(--hairline-w) solid rgba(139,77,255,.32);border-radius:2px 14px 2px 14px;font-family:var(--font-mono);font-size:18px;letter-spacing:.2em;color:var(--text-1)">${channel.schedule}</div>
          <div style="padding:14px 24px;background:rgba(14,14,20,.8);border:var(--hairline-w) solid rgba(34,230,224,.32);border-radius:2px 14px 2px 14px;font-family:var(--font-mono);font-size:18px;letter-spacing:.2em;color:var(--cyan)">FOLLOW FOR GO-LIVE</div>
        </div>
      </div>

      <div style="position:absolute;right:150px;top:250px">
        ${mascotSlot({ width: 480, height: 580, note: '480 × 580 · transparent', steam: false })}
      </div>
    `;
  },
});
</script>
</body>
</html>
