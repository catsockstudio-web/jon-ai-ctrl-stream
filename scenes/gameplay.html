<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JON_AI_CTRL — 01 Gameplay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../src/css/tokens.css">
<link rel="stylesheet" href="../src/css/base.css">
<link rel="stylesheet" href="../src/css/components.css">
<link rel="stylesheet" href="../src/css/effects.css">
<script src="../boot-check.js"></script>
</head>
<body>
<script type="module">
/* 01 / GAMEPLAY — 1920 x 1080, transparent.
   The primary scene. Game capture sits behind this source; every
   module keeps to the 32px margin and stays out of the 1456 x 660
   safe gameplay area (§09). */
import config from '../config.js';
import { startScene } from '../src/js/scene.js';
import { brandBar, systemStrip, chatBox, webcamFrame, activityTiles, goalRail, samplePlate, safeArea, stinger, sceneGround, CAMERA_OPENINGS } from '../src/js/components.js';

startScene(config, {
  alerts: true,
  render(state) {
    const { widgets, display } = state;
    return `
      ${/* The stand-in plate is opaque, so it gets the same camera cutout —
            otherwise it would hide the camera while you position sources. */''}
      ${display.showSampleGameplay ? sceneGround(samplePlate(), CAMERA_OPENINGS.gameplay) : ''}

      ${widgets.brandBar.enabled ? `
        <div style="position:absolute;left:32px;top:32px">${brandBar(state)}</div>` : ''}

      ${widgets.systemStrip.enabled ? `
        <div style="position:absolute;right:32px;top:32px">${systemStrip(state)}</div>` : ''}

      ${state.chat.enabled ? `
        <div style="position:absolute;right:32px;top:120px">${chatBox(state, { width: 360, height: 680 })}</div>` : ''}

      ${widgets.webcam.enabled ? `
        <div style="position:absolute;left:${CAMERA_OPENINGS.gameplay.x}px;top:${CAMERA_OPENINGS.gameplay.y}px">${webcamFrame(state)}</div>` : ''}

      ${widgets.activity.enabled ? `
        <div style="position:absolute;left:472px;top:930px;display:flex;gap:16px">${activityTiles(state)}</div>` : ''}

      ${widgets.goalRail.enabled ? `
        <div style="position:absolute;left:32px;right:32px;bottom:26px">${goalRail(state)}</div>` : ''}

      ${display.showSafeArea ? safeArea() : ''}
      ${stinger()}
    `;
  },
});
</script>
</body>
</html>
