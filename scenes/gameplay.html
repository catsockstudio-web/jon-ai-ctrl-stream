<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JON_AI_CTRL — 01 Gameplay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../src/css/tokens.css">
<link rel="stylesheet" href="../src/css/base.css">
<link rel="stylesheet" href="../src/css/components.css">
<link rel="stylesheet" href="../src/css/effects.css">
<script src="../boot-check.js"></script>
</head>
<body>
<script type="module">
/* 01 / GAMEPLAY — 1920 x 1080, transparent.
   The primary scene. Game capture sits behind this source; every
   module keeps to the 32px margin and stays out of the 1456 x 660
   safe gameplay area (§09). */
import config from '../config.js';
import { startScene } from '../src/js/scene.js';
import { brandBar, systemStrip, chatBox, webcamFrame, activityPanel, goalRail, widgetPlacement, samplePlate, safeArea, stinger, sceneGround, CAMERA_OPENINGS } from '../src/js/components.js';

/* The stretched rail spans the frame, so a plain transform would grow it past
   both edges — the one thing scale presets exist to prevent. Dividing its own
   width by the scale keeps the rendered bar exactly frame-width while the
   thickness and type still scale. */
const RAIL_WIDTH = 1920 - 64;
function railStretch(scale = 1) {
  const s = Math.min(1.5, Math.max(0.6, Number(scale) || 1));
  if (s === 1) return 'position:absolute;left:32px;right:32px;bottom:26px';
  return `position:absolute;left:50%;bottom:26px;width:${RAIL_WIDTH / s}px;`
       + `transform:translateX(-50%) scale(${s});transform-origin:center bottom`;
}

startScene(config, {
  alerts: true,
  render(state) {
    const { widgets, display } = state;
    return `
      ${/* The stand-in plate is opaque, so it gets the same camera cutout —
            otherwise it would hide the camera while you position sources. */''}
      ${display.showSampleGameplay ? sceneGround(samplePlate(), CAMERA_OPENINGS.gameplay) : ''}

      ${widgets.brandBar.enabled ? `
        <div style="${widgetPlacement(widgets.brandBar, 'brandBar', 'top-left')}">${brandBar(state)}</div>` : ''}

      ${widgets.systemStrip.enabled ? `
        <div style="${widgetPlacement(widgets.systemStrip, 'systemStrip', 'top-right')}">${systemStrip(state)}</div>` : ''}

      ${/* The sheet puts chat 120px down so it clears the system strip; that
            offset only applies where the sheet put it. */''}
      ${state.chat.enabled ? `
        <div style="${widgetPlacement(state.chat, 'chat', 'top-right', { top: 120 })}">${chatBox(state, { width: 360, height: 680 })}</div>` : ''}

      ${widgets.webcam.enabled ? `
        <div style="position:absolute;left:${CAMERA_OPENINGS.gameplay.x}px;top:${CAMERA_OPENINGS.gameplay.y}px">${webcamFrame(state)}</div>` : ''}

      ${/* Tiles sit on the baseline row; the recent-events list is taller, so
            it is anchored by its bottom edge and grows upward instead of
            pushing itself off the bottom of the frame. */''}
      ${/* Tiles sit on the sheet's bottom band, clear of the camera. The list
            is taller, so at home it is anchored higher and grows upward. */''}
      ${widgets.activity.enabled ? `
        <div style="${widgetPlacement(state.activity, 'activity', 'bottom-left',
          { left: 472, bottom: state.activity?.mode === 'list' ? 124 : 80 })}">${activityPanel(state)}</div>` : ''}

      ${/* The rail spans the frame at home, which no position preset can
            express — so at home it stretches, and anywhere else it becomes a
            placed block of its authored width. */''}
      ${widgets.goalRail.enabled ? `
        <div style="${(widgets.goalRail.position ?? 'bottom-center') === 'bottom-center'
          ? railStretch(widgets.goalRail.scale)
          : `${widgetPlacement(widgets.goalRail, 'goal', 'bottom-center', { bottom: 26 })};width:840px`}">${goalRail(state)}</div>` : ''}

      ${display.showSafeArea ? safeArea() : ''}
      ${stinger()}
    `;
  },
});
</script>
</body>
</html>
